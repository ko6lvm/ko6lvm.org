<!DOCTYPE html>
<html>
    <head>
        <title>Ryan Kim KO6LVM</title>
        <meta charset="UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <meta property="og:title" content="Ryan Kim KO6LVM"/>
        <meta property="og:description" content="Hi! I'm Ryan Kim, KO6LVM."/>
        <meta property="og:url" content="https://ko6lvm.org"/>
        <meta name="theme-color" content="#4564ff">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0px;
                padding: 0px;
            }
            
            p {
                margin: 0;
            }

            h1 {
                margin: 0;
            }

            h2 {
                margin: 0;
            }

            .landing-page-top {
                height: 100vh;
                width: 100%;
                
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("SFODowntown.jpg");
                
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                
                margin: 0px;
                
                display: flex;
                box-sizing: border-box;
                flex-direction: column;
            }

            .landing-page-main-text {
                font-family: "Roboto";
                font-weight: 800;
                font-style: italic;
                font-size: 8rem;

                color: white;
                text-transform: uppercase;

                padding-top: 20px;
                padding-left: 50px;
            }

            .landing-page-subheading-text {
                font-family: "Roboto";
                font-weight: 500;
                font-size: 2rem;

                color: white;

                padding-left: 50px;

                display: flex;
                flex-direction: column;
            }

            .landing-page-footer-text {
                margin-top: auto;
                padding-right: 20px;
                padding-bottom: 10px;
                align-self: flex-end;

                color: white;
                font-family: "Roboto", sans-serif;
                font-size: 1rem;
            }

            .landing-page-footer-text p {
                background-color: rgba(255, 255, 255, 0.1);
                border: 2px solid white;
                border-radius: 10px;
                padding: 5px;
            }
            
            .button-container {
                margin-top: 20px;
                margin-left: 50px;

                display: flex;
                flex-direction: row;
                gap: 15px;
            }

            .glow-button {
                display: inline-block;
                padding: 12px 24px;
                border: 2px solid white;
                background-color: rgba(255, 255, 255, 0.1);
                color: white;
                text-decoration: none;
                font-family: "Roboto", sans-serif;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 1px;
                transition: all 0.3s ease;
                cursor: pointer;
            }

            .glow-button:hover {
                background-color: white;
                color: black;
                box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            }
            
            .qsl-contact-card-container {
                height: auto;
                width: 100%;

                padding-top: 30px;
                padding-bottom: 30px;

                background: #34495e;
                
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .qsl-card {
                height: auto;
                width: auto;
                background: #2F4254;
                border-radius: 50px;

                color: white;

                display: flex;
                flex-direction: column;

                font-family: "Roboto", sans-serif;

                padding-left: 35px;
                padding-top: 30px;
                padding-bottom: 50px;
                padding-right: 35px;
            }

            .qsl-info {
                height: auto;
                width: auto;
                
                display: flex;
                flex-direction: row;
                gap: 20px;

            }

            .qsl-indiv {
                width: auto;
                height: 100px;

                margin-top: 10px;
                padding: 20px;

                border: 2px solid black;
                border-radius: 30px;

                transition: all 0.3s ease;

                background: #283847;
            }

            .qsl-indiv p {
                margin-top: 5px;
            }

            .qsl-indiv:hover {
                border: 2px solid white;
                background: #34495e;
            }

            @media (max-width: 600px) {
                .landing-page-main-text {
                    font-size: 6rem;
                    padding-left: 20px;
                    padding-top: 10px;
                }

                .landing-page-subheading-text {
                    font-size: 1rem;
                    padding-left: 20px;
                }

                .button-container {
                    margin-left: 20px;
                }

                .qsl-info {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <div class="landing-page-top">
            <div class="landing-page-main-text">
                <p>KO6LVM</p>
            </div>
            <div class="landing-page-subheading-text">
                <i>Jeongwoo "Ryan" Kim</i>
                <i>Amateur Radio Operator</i>
            </div>
            <div class="button-container">
                <a href="mailto:ryan@KO6LVM.org" class="glow-button">Contact Me</a>
                <a href="https://qrz.com/db/KO6LVM" class="glow-button">QRZ</a>
                <a href="https://app.worldradioleague.com/profile/KO6LVM" class="glow-button">WRL</a>
            </div>
            <div class="landing-page-footer-text">
                <p>San Francisco Skyline, 2024 (Wikimedia)</p>
            </div>
        </div>
        <div class="qsl-contact-card-container">
            <div class="qsl-card">
                <h2>QSL INFORMATION</h1>
                <div class="qsl-info">
                    <div class="qsl-indiv">
                        <h2>Digital</h2>
                        <p>QRZ.com, World Radio League</p>
                    </div>
                    <div class="qsl-indiv">
                        <h2>Physical</h2>
                        <p>Physical QSL cards are not accepted at this time.</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
